<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="FlowZa Club membership and booking overview illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e0a38"/>
      <stop offset="0.55" stop-color="#3b1170"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
  </g>

  <!-- membership card -->
  <g transform="rotate(-4 620 520)">
    <rect x="240" y="300" width="760" height="440" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="240" y="300" width="760" height="440" rx="36" fill="url(#sheen)"/>
    <!-- crown mark -->
    <g transform="translate(304 364)">
      <circle r="0" />
      <path d="M8 44 L20 12 L38 34 L56 6 L74 34 L92 12 L104 44 Z" fill="#facc15" opacity="0.95"/>
      <rect x="8" y="50" width="96" height="10" rx="5" fill="#facc15" opacity="0.85"/>
    </g>
    <text x="304" y="520" font-family="ui-monospace, monospace" font-size="30" letter-spacing="6" fill="#e9d5ff">MEMBER · PLATINUM</text>
    <rect x="304" y="556" width="330" height="18" rx="9" fill="#ffffff" opacity="0.85"/>
    <rect x="304" y="592" width="220" height="14" rx="7" fill="#ffffff" opacity="0.4"/>
    <text x="304" y="686" font-family="ui-monospace, monospace" font-size="26" letter-spacing="10" fill="#f3e8ff">0742 ·· 88 · 19</text>
    <circle cx="920" cy="380" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="920" cy="380" r="16" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- booking chips -->
  <g font-family="ui-monospace, monospace" font-size="26">
    <g transform="translate(1030 300)">
      <rect width="380" height="92" rx="24" fill="#ffffff" opacity="0.10"/>
      <rect x="1" y="1" width="378" height="90" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="46" cy="46" r="12" fill="#4ade80"/>
      <text x="80" y="56" fill="#ffffff" opacity="0.92">Court 2 · 6:30 PM</text>
    </g>
    <g transform="translate(1080 430)">
      <rect width="380" height="92" rx="24" fill="#ffffff" opacity="0.10"/>
      <rect x="1" y="1" width="378" height="90" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="46" cy="46" r="12" fill="#22d3ee"/>
      <text x="80" y="56" fill="#ffffff" opacity="0.92">Tee time · 7:10 AM</text>
    </g>
    <g transform="translate(1030 560)">
      <rect width="380" height="92" rx="24" fill="#ffffff" opacity="0.10"/>
      <rect x="1" y="1" width="378" height="90" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
      <circle cx="46" cy="46" r="12" fill="#facc15"/>
      <text x="80" y="56" fill="#ffffff" opacity="0.92">Dinner · Table 12</text>
    </g>
  </g>

  <!-- ledger line -->
  <g transform="translate(240 820)">
    <rect width="1170" height="110" rx="28" fill="#ffffff" opacity="0.08"/>
    <rect x="1" y="1" width="1168" height="108" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="40" y="66" font-family="ui-monospace, monospace" font-size="28" fill="#e9d5ff">LEDGER</text>
    <text x="220" y="66" font-family="ui-monospace, monospace" font-size="28" fill="#ffffff" opacity="0.9">DR 12,480.00</text>
    <text x="560" y="66" font-family="ui-monospace, monospace" font-size="28" fill="#ffffff" opacity="0.9">CR 12,480.00</text>
    <g transform="translate(950 30)">
      <rect width="180" height="50" rx="25" fill="#4ade80" opacity="0.2"/>
      <circle cx="30" cy="25" r="8" fill="#4ade80"/>
      <text x="52" y="34" font-family="ui-monospace, monospace" font-size="24" fill="#bbf7d0">TIES OUT</text>
    </g>
  </g>
</svg>
